<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1726"><title>Mine Duel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1726'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%2355c7ff'%3E✹%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/style.85c75f59a010.css"><script type="module" src="./js/main.42a78c9602fc.js"></script>
</head><body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-mine" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M5 19l3-3M16 8l3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6" fill="currentColor"/><circle cx="10" cy="10" r="1.5" fill="#0d1726"/></symbol>
    <symbol id="icon-flag" viewBox="0 0 24 24"><path d="M6 21V3m0 0h13l-3 5 3 5H6" stroke="currentColor" fill="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 21h7" stroke="currentColor" stroke-width="2"/></symbol>
  </svg>

<main id="app" class="app">
<header class="header"><div class="brand"><span class="eyebrow" data-i18n="brand"></span><h1>Mine Duel<span class="brand-dot">.</span></h1></div><button id="help" class="help" data-i18n-aria="menu" aria-haspopup="dialog">☰</button></header>
<section class="status" data-i18n-aria="status"><div class="status-top"><span id="turn" class="turn"></span><span id="difficulty" class="difficulty"></span></div><div id="phase" class="phase"></div><div class="metrics"><span id="mine-counts"></span><span id="marker-budget"></span></div></section>
<section class="board-section" data-i18n-aria="board"><div id="board" class="board" role="group" data-i18n-aria="boardSize"></div></section>
<div class="legend"><span><i class="swatch player"></i><span data-i18n="myExplore"></span></span><span><i class="swatch cpu"></i><span data-i18n="cpuExplore"></span></span><span class="flag-player">⚑ <span data-i18n="ownMarker"></span></span><span class="flag-cpu">⚑ <span data-i18n="cpuMarker"></span></span></div>
<p id="feedback" class="feedback" role="status" aria-live="polite"></p>
<nav class="controls" data-i18n-aria="controls"><button class="control" data-mode="explore" data-i18n="explore"></button><button class="control" data-mode="mine" data-i18n="mine"></button><button class="control" data-mode="marker" data-i18n="marker"></button><button class="control" data-mode="remove" data-i18n="remove"></button><button class="end-turn" id="end-turn" data-i18n="endTurn"></button></nav>
<footer class="footer"><span data-i18n="gameName"></span><span id="version"></span></footer>
</main>
<dialog id="language-dialog" class="modal compact-modal" aria-labelledby="language-title"><h2 id="language-title">Select Language</h2><div class="language-options"><button class="secondary" data-language="ko" lang="ko" aria-pressed="false">한국어</button><button class="secondary" data-language="ja" lang="ja" aria-pressed="false">日本語</button><button class="secondary" data-language="en" lang="en" aria-pressed="false">English</button><button class="secondary" data-language="zh-CN" lang="zh-CN" aria-pressed="false">简体中文</button></div><button class="secondary" id="language-close" data-close data-i18n="close"></button></dialog>
<dialog id="menu-dialog" class="modal compact-modal" aria-labelledby="menu-title"><h2 id="menu-title" data-i18n="menu"></h2><div class="menu-options"><button class="secondary" data-menu="rules" data-i18n="rules"></button><button class="secondary" data-menu="confirm" data-i18n="restart"></button><button class="secondary" data-menu="language" data-i18n="language"></button></div><button class="primary" data-close data-i18n="close"></button></dialog>
<dialog id="rules-dialog" class="modal rules-modal" aria-labelledby="rules-title">
<div class="modal-heading"><span class="eyebrow" data-i18n="guide"></span><h2 id="rules-title" data-i18n="gameName"></h2><p data-i18n="intro"></p></div>
<div id="rules-scroll" class="rules-scroll" tabindex="0" data-i18n-aria="scrollRules"></div>
<div class="modal-footer"><fieldset id="difficulty-picker"><legend data-i18n="difficultyTitle"></legend><div class="difficulty-options"><label><input type="radio" name="difficulty" value="easy" ><span><span data-i18n="easy"></span><small data-rate="easy"></small></span></label><label><input type="radio" name="difficulty" value="normal" checked><span><span data-i18n="normal"></span><small data-rate="normal"></small></span></label><label><input type="radio" name="difficulty" value="hard" ><span><span data-i18n="hard"></span><small data-rate="hard"></small></span></label></div></fieldset><button class="primary" id="rules-action" data-i18n="start"></button></div></dialog>
<dialog id="confirm-dialog" class="modal compact-modal" aria-labelledby="confirm-title"><h2 id="confirm-title" data-i18n="restartTitle"></h2><p data-i18n="restartBody"></p><div class="dialog-actions"><button class="secondary" data-close data-i18n="cancel"></button><button class="primary" id="confirm-restart" data-i18n="restart"></button></div></dialog>
<dialog id="update-dialog" class="modal compact-modal" aria-labelledby="update-title"><h2 id="update-title" data-i18n="updateTitle"></h2><p data-i18n="updateBody"></p><div class="dialog-actions"><button class="secondary" id="update-later" data-i18n="later"></button><button class="primary" id="update-now" data-i18n="update"></button></div></dialog>
<dialog id="result-dialog" class="modal result-modal" aria-labelledby="result-title"><span class="eyebrow" data-i18n="phase.finished"></span><h2 id="result-title"></h2><p id="result-reason"></p><p id="result-turns"></p><div class="result-buttons"><button class="primary" id="restart" data-i18n="restart"></button><button class="secondary" id="result-help" data-i18n="menu"></button></div></dialog>
<noscript>JavaScript is required. / JavaScript를 활성화해 주세요. / JavaScriptを有効にしてください。 / 请启用JavaScript。</noscript>
</body></html>
