<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mine Duel</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./css/style.css"><script type="module" src="./js/online-main.js"></script></head>
<body><main class="app online-app">
<header class="header"><h1>Mine Duel<span class="brand-dot">.</span></h1><select id="online-language" aria-label="Language"><option value="ko">한국어</option><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option></select></header>
<section id="online-lobby" class="online-lobby"><h2 data-ot="online"></h2><div class="dialog-actions"><button id="create-room" class="secondary" data-ot="create"></button><button id="join-room" class="secondary" data-ot="join"></button></div><label><span data-ot="code"></span><input id="room-input" maxlength="10" autocapitalize="characters" autocomplete="off" spellcheck="false"></label></section>
<section class="status"><div class="status-top"><strong id="online-turn"></strong><output id="online-clock" aria-live="off"></output></div><div id="online-phase" class="phase"></div><div id="online-presence" class="metrics"></div><p id="online-room-code"></p><button id="copy-invite" class="secondary" data-ot="invite"></button><output id="invite-url"></output></section>
<p id="online-counts" class="metrics"></p><section class="board-section"><div id="online-board" class="board" role="group"></div></section>
<p id="online-legend" class="legend"></p><p id="online-feedback" class="feedback" aria-live="polite" role="status"></p>
<nav id="online-controls" class="controls"><button data-online-mode="explore" data-ot="explore"></button><button data-online-mode="mine" data-ot="mine"></button><button data-online-mode="marker" data-ot="marker"></button><button data-online-mode="remove" data-ot="remove"></button><button id="online-end" class="end-turn" data-ot="end"></button></nav>
<div class="online-actions"><button id="online-ready" class="primary" data-ot="ready"></button><button id="online-rematch" class="primary" data-ot="rematch"></button><button id="online-reconnect" class="secondary" data-ot="reconnect"></button><button id="online-leave" class="secondary" data-ot="leave"></button><button id="online-rules" class="secondary" data-ot="rules"></button><button id="online-back" class="secondary" data-ot="back"></button></div>
<section id="online-result" hidden aria-live="polite"><h2 id="online-result-title"></h2><p id="online-result-reason"></p><p id="online-result-score"></p></section>
<footer class="footer"><span data-ot="online"></span><span id="online-version"></span></footer>
</main>
<dialog id="online-rules-dialog" class="modal compact-modal"><h2 data-ot="rules"></h2><p data-ot="ruleText"></p><button class="primary" data-online-close data-ot="confirm"></button></dialog>
<dialog id="online-leave-dialog" class="modal compact-modal"><p data-ot="leaveConfirm"></p><div class="dialog-actions"><button class="secondary" data-online-close data-ot="cancel"></button><button id="online-confirm-leave" class="primary" data-ot="leave"></button></div></dialog>
</body></html>
